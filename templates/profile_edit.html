{% extends 'base.html' %}
{% block title %}Настройки профиля — InkSpot{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <h1 class="h3 mb-4">Настройки профиля</h1>
        <form method="post" enctype="multipart/form-data" class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <div class="mb-3">
                    <label class="form-label">Имя пользователя</label>
                    <input type="text" class="form-control" value="{{ current_user.username }}" disabled>
                </div>
                <div class="mb-3">
                    <label class="form-label">О себе</label>
                    <textarea name="bio" class="form-control" rows="4" placeholder="Расскажите немного о себе">{{ current_user.bio or '' }}</textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Аватар</label>
                    <input type="file" name="avatar" class="form-control" accept="image/*">
                </div>
                <div class="text-end">
                    <a href="{{ url_for('profile', username=current_user.username) }}" class="btn btn-outline-secondary">Отмена</a>
                    <button class="btn btn-primary px-4">Сохранить</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
