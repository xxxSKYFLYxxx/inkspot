{% extends 'base.html' %}
{% block title %}Вход — InkSpot{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 mb-4 text-center">Вход в аккаунт</h1>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Логин или email</label>
                        <input type="text" name="login" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="remember" id="remember">
                        <label class="form-check-label" for="remember">Запомнить меня</label>
                    </div>
                    <button class="btn btn-primary w-100 py-2">Войти</button>
                </form>
                <hr class="my-4">
                <p class="text-center mb-0 text-muted small">Ещё нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
